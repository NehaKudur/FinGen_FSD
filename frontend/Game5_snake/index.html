<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FinGen - Snake & Ladder</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

<h1 class="title">Financial Snake & Ladder</h1>
<p class="subtitle">Make smart financial decisions to climb the ladder</p>

<div id="board" class="board"></div>

<div class="controls">

<button id="rollDice">Roll Dice</button>

<div class="diceResult">Dice: <span id="dice">-</span></div>
<div class="position">Position: <span id="pos">1</span></div>
<div class="score">Score: <span id="score">0</span></div>

</div>

<div id="scenarioBox" class="scenario hidden">
<p id="scenarioText"></p>

<button class="choice" onclick="choose(1)">Option 1</button>
<button class="choice" onclick="choose(2)">Option 2</button>

</div>

<div id="summary" class="summary hidden">

<h2>Game Summary</h2>
<p id="result"></p>

<button id="analyze">AI Financial Analysis</button>

<div id="ai"></div>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
