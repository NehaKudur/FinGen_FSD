<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinGen – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #000;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    .bg-elements {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 0;
    }

    .floating-icon {
      position: absolute;
      opacity: 0.15;
      animation: floatAround linear infinite;
    }

    @keyframes floatAround {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.15; }
      90%  { opacity: 0.15; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(0, 10, 30, 0.85);
      border: 2px solid #00aaff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: min(420px, 92vw);
      box-shadow: 0 0 30px rgba(0, 170, 255, 0.3);
      overflow: hidden;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo span {
      font-size: 1.6rem;
      background: linear-gradient(90deg, #00aaff, #0044ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo p {
      color: #88ccff;
      font-size: clamp(0.48rem, 1.4vw, 0.54rem);
      margin-top: 8px;
      line-height: 1.8;
    }

    h2 {
      color: #00aaff;
      font-size: clamp(0.8rem, 2vw, 0.88rem);
      text-align: center;
      margin-bottom: 28px;
      letter-spacing: 2px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #88ccff;
      font-size: clamp(0.48rem, 1.3vw, 0.54rem);
      margin-bottom: 8px;
      letter-spacing: 1px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0, 30, 60, 0.8);
      border: 1px solid #0055aa;
      border-radius: 8px;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.48rem, 1.3vw, 0.54rem);
      line-height: 1.55;
      outline: none;
      transition: border 0.3s;
    }

    input:focus {
      border-color: #00aaff;
      box-shadow: 0 0 8px rgba(0, 170, 255, 0.4);
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: linear-gradient(135deg, #0044ff, #00aaff);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.58rem, 1.5vw, 0.64rem);
      line-height: 1.45;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.3s;
      box-shadow: 0 0 15px rgba(0, 170, 255, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 170, 255, 0.7);
    }

    .error-msg {
      color: #ff4444;
      font-size: clamp(0.43rem, 1.2vw, 0.5rem);
      text-align: center;
      margin-top: 12px;
      display: none;
      line-height: 1.8;
    }

    .signup-link {
      text-align: center;
      margin-top: 20px;
      color: #88ccff;
      font-size: clamp(0.43rem, 1.2vw, 0.5rem);
      line-height: 2;
    }

    .signup-link a {
      color: #00aaff;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .forgot {
      text-align: right;
      font-size: clamp(0.38rem, 1.1vw, 0.44rem);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .card {
        padding: 28px 22px;
      }
    }

    .forgot a {
      color: #0088cc;
      font-size: 0.35rem;
      text-decoration: none;
    }

    .forgot a:hover {
      color: #00aaff;
    }

    :root {
      --blue: #00aaff;
      --blue-dark: #0044ff;
      --cyan: #00e5ff;
      --yellow: #ffd700;
      --purple: #8b00ff;
      --purple-light: #b44fff;
      --bg: #0d0015;
      --bg2: #07000d;
      --surface: rgba(20, 0, 40, 0.88);
      --text: #f0e8ff;
      --text-dim: #9a7abf;
    }

    html { scroll-behavior: smooth; }

    body {
      background:
        radial-gradient(circle at 15% 20%, rgba(180, 79, 255, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 85% 70%, rgba(0, 170, 255, 0.14) 0%, transparent 30%),
        linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
      font-family: 'Orbitron', sans-serif;
      color: var(--text);
      padding: 86px 16px 24px;
      overflow-x: hidden;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
    }

    #bgCanvas {
      position: fixed;
      inset: 0;
      z-index: -4;
      width: 100%;
      height: 100%;
    }

    .floating-coins {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      height: 48px;
      background: rgba(10, 0, 25, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(180, 79, 255, 0.4);
      box-shadow: 0 0 30px rgba(139, 0, 255, 0.2);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.56rem;
      background: linear-gradient(90deg, var(--yellow), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 8px rgba(0, 170, 255, 0.45);
      cursor: pointer;
    }

    .navbar-logo {
      height: 28px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(0,170,255,0.45));
    }

    .nav-home {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.3rem;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid var(--blue);
      background: linear-gradient(135deg, rgba(0, 170, 255, 0.08), rgba(139, 0, 255, 0.08));
      color: var(--blue);
      letter-spacing: 0.5px;
      transition: all 0.3s;
      text-decoration: none;
    }

    .nav-home:hover {
      background: rgba(0, 170, 255, 0.12);
      box-shadow: 0 0 20px rgba(0, 170, 255, 0.6);
      transform: translateY(-1px);
    }

    .card {
      background: linear-gradient(135deg, rgba(20, 0, 40, 0.92), rgba(0, 22, 58, 0.92));
      border: 1px solid rgba(180, 79, 255, 0.45);
      border-radius: 24px;
      box-shadow: 0 0 40px rgba(180, 79, 255, 0.18);
      backdrop-filter: blur(10px);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(180, 79, 255, 0.08), rgba(0, 170, 255, 0.03));
      pointer-events: none;
    }

    .logo span {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.08rem;
      background: linear-gradient(90deg, var(--yellow), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo p,
    .signup-link,
    .forgot,
    label {
      color: var(--text-dim);
    }

    h2 {
      font-family: 'Press Start 2P', monospace;
      color: var(--blue);
    }

    input {
      border: 1px solid rgba(0, 85, 170, 0.9);
      color: var(--text);
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 8px rgba(0, 170, 255, 0.4);
    }

    .btn {
      background: linear-gradient(135deg, var(--blue-dark), var(--blue));
      box-shadow: 0 0 15px rgba(0, 170, 255, 0.4);
    }

    .btn:hover {
      box-shadow: 0 0 25px rgba(0, 170, 255, 0.7);
    }

    .signup-link a,
    .forgot a {
      color: var(--blue);
    }

    .floating-icon {
      opacity: 0.12;
    }

    @media (max-width: 480px) {
      body { padding: 80px 12px 20px; }
      .card { padding: 28px 22px; }
      .nav-brand { font-size: 0.45rem; }
      .nav-home { font-size: 0.26rem; padding: 7px 10px; }
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>
  <canvas id="bgCanvas"></canvas>
  <div class="floating-coins" id="floatingCoins"></div>
  <div class="bg-elements" id="bgElements"></div>

  <nav class="navbar">
    <div class="nav-brand" onclick="location.href='/index.html'">
      <img src="../../assets/logo_with_name.png" alt="FinGen" class="navbar-logo">
    </div>
    <a class="nav-home" href="/index.html">HOME</a>
  </nav>

  <div class="card">
    <div class="logo">
      <span>💰 FinGen</span>
      <p>Your gamified financial literacy platform</p>
    </div>

    <h2>WELCOME BACK</h2>

    <div class="form-group">
      <label>EMAIL ADDRESS</label>
      <input type="email" id="email" placeholder="Enter your email" />
    </div>

    <div class="form-group">
      <label>PASSWORD</label>
      <input type="password" id="password" placeholder="Enter your password" />
    </div>

    <div class="forgot">
      <a href="#">Forgot password?</a>
    </div>

    <button class="btn" onclick="handleLogin()">LOGIN</button>
    <p class="error-msg" id="errorMsg"></p>

    <div class="signup-link">
      Don't have an account? <a href="signup.html">Sign up here</a>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "../firebase.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const canvas = document.getElementById('bgCanvas');
    const context = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function drawBackground() {
      const width = canvas.width;
      const height = canvas.height;
      context.clearRect(0, 0, width, height);
      const gradient = context.createRadialGradient(width * 0.2, height * 0.2, 0, width * 0.2, height * 0.2, width * 0.75);
      gradient.addColorStop(0, 'rgba(180, 79, 255, 0.18)');
      gradient.addColorStop(1, 'rgba(180, 79, 255, 0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);
      requestAnimationFrame(drawBackground);
    }
    drawBackground();

    // Floating background icons
    const icons = ['💰','📈','💳','🏦','💵','📊','🪙','💹'];
    const bg = document.getElementById('bgElements');
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('div');
      el.className = 'floating-icon';
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (8 + Math.random() * 12) + 's';
      el.style.animationDelay = (Math.random() * 10) + 's';
      el.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
      bg.appendChild(el);
    }

    const floatingCoins = document.getElementById('floatingCoins');
    const coinIcons = ['💰', '🪙', '💎', '📈'];
    for (let i = 0; i < 12; i++) {
      const coin = document.createElement('div');
      coin.className = 'floating-icon';
      coin.textContent = coinIcons[i % coinIcons.length];
      coin.style.left = Math.random() * 100 + '%';
      coin.style.animationDuration = (10 + Math.random() * 14) + 's';
      coin.style.animationDelay = (Math.random() * 8) + 's';
      coin.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
      floatingCoins.appendChild(coin);
    }

    window.handleLogin = async function () {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.style.display = 'none';

      if (!email || !password) {
        errorMsg.textContent = 'Please fill in all fields!';
        errorMsg.style.display = 'block';
        return;
      }

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Fetch user role from Firestore
        const docSnap = await getDoc(doc(db, "users", user.uid));

        if (docSnap.exists()) {
          const userData = docSnap.data();

          if (userData.role === 'admin') {
            window.location.href = "/frontend/auth/admin.html";
          } else {
            window.location.href = "/index.html";
          }
        } else {
          errorMsg.textContent = 'User data not found. Contact support.';
          errorMsg.style.display = 'block';
        }

      } catch (err) {
        errorMsg.style.display = 'block';
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          errorMsg.textContent = 'Invalid email or password!';
        } else {
          errorMsg.textContent = 'Error: ' + err.message;
        }
      }
    }
  </script>
</body>
</html>
