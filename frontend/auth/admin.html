<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinGen – Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #000010;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      font-size: 17px;
      overflow-x: hidden;
    }

    .bg-elements {
      position: fixed;
      width: 100%; height: 100%;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 0;
    }

    .floating-icon {
      position: absolute;
      opacity: 0.08;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.08; }
      90%  { opacity: 0.08; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 32px;
      background: rgba(0, 5, 20, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 100, 0, 0.3);
    }

    .nav-brand {
      font-size: 0.9rem;
      background: linear-gradient(90deg, #ff6600, #ffaa00);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-right {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .nav-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.4rem;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .nav-btn.home {
      background: transparent;
      border: 1px solid #00aaff;
      color: #00aaff;
    }

    .nav-btn.home:hover {
      background: rgba(0, 170, 255, 0.1);
    }

    .nav-btn.logout {
      background: transparent;
      border: 1px solid #ff4444;
      color: #ff4444;
    }

    .nav-btn.logout:hover {
      background: rgba(255, 68, 68, 0.1);
    }

    /* Container */
    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 100px 24px 60px;
    }

    .page-title {
      font-size: 1rem;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ff6600, #ffaa00);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.5;
    }

    .page-subtitle {
      font-size: 0.42rem;
      text-align: center;
      color: #88ccff;
      margin-bottom: 40px;
      line-height: 2;
    }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: rgba(0, 10, 30, 0.85);
      border: 1px solid #ff6600;
      border-radius: 14px;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 0 15px rgba(255, 100, 0, 0.15);
      transition: all 0.3s;
    }

    .stat-card:hover {
      border-color: #ffaa00;
      box-shadow: 0 0 25px rgba(255, 170, 0, 0.3);
      transform: translateY(-3px);
    }

    .stat-icon {
      font-size: 1.4rem;
      margin-bottom: 12px;
      color: #ffaa00;
    }

    .stat-value {
      font-size: 1.35rem;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .stat-label {
      font-size: 0.32rem;
      color: #88ccff;
      line-height: 1.8;
    }

    /* Search section */
    .section-card {
      background: rgba(0, 10, 30, 0.85);
      border: 1px solid #0044ff;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 0 15px rgba(0, 100, 255, 0.15);
    }

    .section-heading {
      font-size: 0.62rem;
      color: #ffaa00;
      margin-bottom: 20px;
      letter-spacing: 2px;
      border-bottom: 1px solid rgba(255, 150, 0, 0.3);
      padding-bottom: 12px;
    }

    .search-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(0, 30, 60, 0.8);
      border: 1px solid #0055aa;
      border-radius: 8px;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.44rem;
      outline: none;
      transition: border 0.3s;
    }

    .search-input:focus {
      border-color: #00aaff;
      box-shadow: 0 0 8px rgba(0, 170, 255, 0.3);
    }

    .search-btn {
      padding: 12px 20px;
      background: linear-gradient(135deg, #ff6600, #ffaa00);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.44rem;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .search-btn:hover {
      box-shadow: 0 0 15px rgba(255, 170, 0, 0.5);
      transform: translateY(-1px);
    }

    /* User result card */
    .user-result {
      display: none;
      background: rgba(0, 20, 50, 0.8);
      border: 1px solid #0044ff;
      border-radius: 12px;
      padding: 24px;
    }

    .user-result.visible {
      display: block;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0, 100, 255, 0.2);
    }

    .result-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0044ff, #00aaff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 170, 255, 0.4);
      flex-shrink: 0;
    }

    .result-info {
      flex: 1;
    }

    .result-name {
      font-size: 0.72rem;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .result-email {
      font-size: 0.4rem;
      color: #88ccff;
      margin-bottom: 12px;
      line-height: 1.8;
      word-break: break-word;
    }

    .result-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.32rem;
      letter-spacing: 1px;
      line-height: 1.5;
    }

    .badge-role {
      background: linear-gradient(135deg, #0044ff, #00aaff);
      color: #fff;
    }

    .badge-role.admin {
      background: linear-gradient(135deg, #ff6600, #ffaa00);
    }

    .badge-level {
      border: 1px solid #00aaff;
      color: #00aaff;
    }

    .badge-level.intermediate {
      border-color: #ffaa00;
      color: #ffaa00;
    }

    .badge-level.expert {
      border-color: #00ff88;
      color: #00ff88;
    }

    /* Result stats */
    .result-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .result-stat {
      background: rgba(0, 30, 60, 0.6);
      border: 1px solid rgba(0, 80, 180, 0.3);
      border-radius: 10px;
      padding: 16px 12px;
      text-align: center;
    }

    .result-stat-value {
      font-size: 0.95rem;
      color: #00aaff;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .result-stat-label {
      font-size: 0.3rem;
      color: #88ccff;
      line-height: 1.8;
    }

    /* Games list in result */
    .result-games-title {
      font-size: 0.45rem;
      color: #ffaa00;
      margin-bottom: 12px;
    }

    .game-tag {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(0, 100, 255, 0.15);
      border: 1px solid rgba(0, 170, 255, 0.3);
      border-radius: 20px;
      font-size: 0.32rem;
      color: #00aaff;
      margin: 4px;
    }

    .no-games {
      font-size: 0.4rem;
      color: #445566;
      line-height: 2;
    }

    /* Error/not found */
    .not-found {
      display: none;
      text-align: center;
      padding: 30px;
      color: #ff4444;
      font-size: 0.44rem;
      line-height: 2.5;
    }

    .not-found.visible {
      display: block;
    }

    /* Loading */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 170, 0, 0.2);
      border-top-color: #ffaa00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto;
      display: none;
    }

    .spinner.visible {
      display: block;
    }

    .admin-only-msg {
      text-align: center;
      padding: 60px;
      color: #ff4444;
      font-size: 0.48rem;
      line-height: 2.5;
      display: none;
    }

    @media (max-width: 768px) {
      .container {
        padding: 92px 16px 40px;
      }

      .stats-row,
      .result-stats {
        grid-template-columns: 1fr;
      }

      .search-row {
        flex-direction: column;
      }

      .nav-brand {
        font-size: 0.76rem;
      }

      .page-title {
        font-size: 0.84rem;
      }

      .page-subtitle {
        font-size: 0.34rem;
      }

      .nav-btn,
      .search-input,
      .search-btn,
      .logout-btn {
        font-size: 0.36rem;
      }

      .result-header {
        flex-direction: column;
        text-align: center;
      }

      .result-badges {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="bg-elements" id="bgElements"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-brand">🛠️ FINGEN ADMIN</div>
    <div class="nav-right">
      <button class="nav-btn home" onclick="location.href='/index.html'">← HOME</button>
      <button class="nav-btn logout" id="logoutBtn">LOGOUT</button>
    </div>
  </nav>

  <div class="container">

    <!-- Admin only warning -->
    <div class="admin-only-msg" id="adminOnlyMsg">
      ⛔ ACCESS DENIED<br/><br/>
      This page is for admins only!
    </div>

    <div id="dashboardContent" style="display:none">

      <h1 class="page-title">ADMIN DASHBOARD</h1>
      <p class="page-subtitle">Welcome back, <span id="adminName">Admin</span></p>

      <!-- Stats Row -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-users"></i></div>
          <div class="stat-value" id="totalUsers">--</div>
          <div class="stat-label">TOTAL USERS</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-user-shield"></i></div>
          <div class="stat-value" id="totalAdmins">--</div>
          <div class="stat-label">TOTAL ADMINS</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-gamepad"></i></div>
          <div class="stat-value" id="mostPlayed">--</div>
          <div class="stat-label">MOST PLAYED GAME</div>
        </div>
      </div>

      <!-- Search Section -->
      <div class="section-card">
        <div class="section-heading">🔍 SEARCH USER</div>

        <div class="search-row">
          <input
            type="text"
            class="search-input"
            id="searchInput"
            placeholder="Enter username..."
          />
          <button class="search-btn" onclick="searchUser()">SEARCH</button>
        </div>

        <div class="spinner" id="searchSpinner"></div>
        <div class="not-found" id="notFound">❌ No user found with that name!</div>

        <!-- User Result -->
        <div class="user-result" id="userResult">
          <div class="result-header">
            <div class="result-avatar" id="resultAvatar">?</div>
            <div class="result-info">
              <div class="result-name" id="resultName">--</div>
              <div class="result-email" id="resultEmail">--</div>
              <div class="result-badges">
                <span class="badge badge-role" id="resultRoleBadge">USER</span>
                <span class="badge badge-level" id="resultLevelBadge">BEGINNER</span>
              </div>
            </div>
          </div>

          <div class="result-stats">
            <div class="result-stat">
              <div class="result-stat-value" id="resultGamesCount">0</div>
              <div class="result-stat-label">GAMES PLAYED</div>
            </div>
            <div class="result-stat">
              <div class="result-stat-value" id="resultLevel">--</div>
              <div class="result-stat-label">LEVEL</div>
            </div>
            <div class="result-stat">
              <div class="result-stat-value" id="resultMemberSince">--</div>
              <div class="result-stat-label">MEMBER SINCE</div>
            </div>
          </div>

          <div class="result-games-title">🎮 GAMES PLAYED</div>
          <div id="resultGamesList">
            <span class="no-games">No games played yet!</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { auth, db } from "../firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    // Floating background
    const icons = ['💰','📈','💳','🏦','💵','📊','🪙','💹'];
    const bg = document.getElementById('bgElements');
    for (let i = 0; i < 15; i++) {
      const el = document.createElement('div');
      el.className = 'floating-icon';
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (8 + Math.random() * 12) + 's';
      el.style.animationDelay = (Math.random() * 10) + 's';
      el.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
      bg.appendChild(el);
    }

    const gameNames = {
      'game1': 'Grocery Grab',
      'game2': 'Haunted Escape Room',
      'game3': 'Recession Run',
      'game4': 'Mahjong Money',
      'game5': 'Finance Snake & Ladder',
      'game6': 'UNO Investment Strategy',
    };

    // Check auth + admin role
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/frontend/auth/login.html';
        return;
      }

      const docSnap = await getDoc(doc(db, "users", user.uid));
      if (!docSnap.exists() || docSnap.data().role !== 'admin') {
        document.getElementById('adminOnlyMsg').style.display = 'block';
        return;
      }

      const data = docSnap.data();
      document.getElementById('dashboardContent').style.display = 'block';
      document.getElementById('adminName').textContent = data.name;

      // Load stats
      await loadStats();
    });

    // Load platform stats
    async function loadStats() {
      const snapshot = await getDocs(collection(db, "users"));
      let totalUsers = 0;
      let totalAdmins = 0;
      const gameCount = {};

      snapshot.forEach(doc => {
  const d = doc.data();
  if (d.role === 'admin') {
    totalAdmins++;
  } else {
    totalUsers++;
  }
        (d.gamesPlayed || []).forEach(g => {
          gameCount[g] = (gameCount[g] || 0) + 1;
        });
      });

      document.getElementById('totalUsers').textContent = totalUsers;
      document.getElementById('totalAdmins').textContent = totalAdmins;

      // Most played game
      if (Object.keys(gameCount).length > 0) {
        const mostPlayed = Object.entries(gameCount).sort((a, b) => b[1] - a[1])[0][0];
        document.getElementById('mostPlayed').textContent = gameNames[mostPlayed] || mostPlayed;
      } else {
        document.getElementById('mostPlayed').textContent = 'N/A';
      }
    }

    // Search user by name
    window.searchUser = async function () {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) return;

      // Reset UI
      document.getElementById('userResult').classList.remove('visible');
      document.getElementById('notFound').classList.remove('visible');
      document.getElementById('searchSpinner').classList.add('visible');

      const snapshot = await getDocs(collection(db, "users"));
      let found = null;

      snapshot.forEach(doc => {
        const d = doc.data();
        if (d.name && d.name.toLowerCase().includes(query)) {
          found = d;
        }
      });

      document.getElementById('searchSpinner').classList.remove('visible');

      if (!found) {
        document.getElementById('notFound').classList.add('visible');
        return;
      }

      // Populate result
      document.getElementById('resultAvatar').textContent = found.name.charAt(0).toUpperCase();
      document.getElementById('resultName').textContent = found.name;
      document.getElementById('resultEmail').textContent = found.email;

      const roleBadge = document.getElementById('resultRoleBadge');
      roleBadge.textContent = found.role.toUpperCase();
      roleBadge.className = 'badge badge-role' + (found.role === 'admin' ? ' admin' : '');

      const levelBadge = document.getElementById('resultLevelBadge');
      levelBadge.textContent = found.level.toUpperCase();
      levelBadge.className = 'badge badge-level' + 
        (found.level === 'Intermediate' ? ' intermediate' : found.level === 'Expert' ? ' expert' : '');

      const gamesPlayed = found.gamesPlayed || [];
      document.getElementById('resultGamesCount').textContent = gamesPlayed.length;
      document.getElementById('resultLevel').textContent = found.level;

      if (found.createdAt) {
        const date = new Date(found.createdAt);
        document.getElementById('resultMemberSince').textContent =
          date.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' });
      }

      // Games tags
      const gamesEl = document.getElementById('resultGamesList');
      if (gamesPlayed.length > 0) {
        gamesEl.innerHTML = gamesPlayed.map(g =>
          `<span class="game-tag">${gameNames[g] || g}</span>`
        ).join('');
      } else {
        gamesEl.innerHTML = '<span class="no-games">No games played yet!</span>';
      }

      document.getElementById('userResult').classList.add('visible');
    }

    // Allow search on Enter key
    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchUser();
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = '/frontend/auth/login.html';
    });
  </script>
</body>
</html>
