<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinGen – My Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --blue: #00aaff;
      --blue-dark: #0044ff;
      --cyan: #00e5ff;
      --yellow: #ffd700;
      --purple: #8b00ff;
      --purple-light: #b44fff;
      --pink: #ff6ec7;
      --bg: #0d0015;
      --bg2: #07000d;
      --surface: rgba(20, 0, 40, 0.85);
      --surface-strong: rgba(12, 0, 28, 0.95);
      --text: #f0e8ff;
      --text-dim: #9a7abf;
      --glow-blue: 0 0 20px rgba(0, 170, 255, 0.6);
      --glow-purple: 0 0 20px rgba(180, 79, 255, 0.6);
      --glow-yellow: 0 0 20px rgba(255, 215, 0, 0.45);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 20%, rgba(180, 79, 255, 0.22) 0%, transparent 35%),
        radial-gradient(circle at 85% 70%, rgba(0, 170, 255, 0.14) 0%, transparent 30%),
        linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
      font-family: 'Orbitron', sans-serif;
      color: var(--text);
      font-size: 16px;
      overflow-x: hidden;
      padding-top: 74px;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.06) 2px,
        rgba(0, 0, 0, 0.06) 4px
      );
    }

    #bgCanvas {
      position: fixed;
      inset: 0;
      z-index: -4;
      width: 100%;
      height: 100%;
    }

    .floating-coins {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .floating-icon {
      position: absolute;
      opacity: 0.12;
      animation: floatUp linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.12; }
      90%  { opacity: 0.12; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }

    .bg-elements {
      position: fixed;
      width: 100%; height: 100%;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 0;
    }

    .floating-icon {
      position: absolute;
      opacity: 0.1;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.1; }
      90%  { opacity: 0.1; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      height: 48px;
      background: rgba(10, 0, 25, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(180, 79, 255, 0.4);
      box-shadow: 0 0 30px rgba(139, 0, 255, 0.2);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.56rem;
      background: linear-gradient(90deg, var(--yellow), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      text-shadow: 0 0 8px rgba(0, 170, 255, 0.45);
    }

    .nav-brand .navbar-logo {
      height: 28px;
      max-width: 180px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(0,170,255,0.5));
      -webkit-text-fill-color: initial;
    }

    .nav-back {
      font-size: 0.3rem;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid var(--blue);
      background: linear-gradient(135deg, rgba(0, 170, 255, 0.08), rgba(139, 0, 255, 0.08));
      color: var(--blue);
      font-family: 'Press Start 2P', monospace;
      letter-spacing: 0.5px;
      transition: all 0.3s;
    }

    .nav-back:hover {
      background: rgba(0, 170, 255, 0.12);
      box-shadow: var(--glow-blue);
      transform: translateY(-1px);
    }

    /* Main content */
    .container {
      position: relative;
      z-index: 1;
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    .page-title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.84rem, 2vw, 1rem);
      text-align: center;
      margin-bottom: 30px;
      background: linear-gradient(90deg, var(--yellow), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      line-height: 1.5;
      text-shadow: 0 0 18px rgba(0, 170, 255, 0.2);
    }

    /* Profile card */
    .profile-card {
      background: linear-gradient(135deg, rgba(20, 0, 40, 0.92), rgba(0, 22, 58, 0.92));
      border: 1px solid rgba(180, 79, 255, 0.45);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 0 40px rgba(180, 79, 255, 0.18);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 32px;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .profile-card::before,
    .section-card::before,
    .stat-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(180, 79, 255, 0.08), rgba(0, 170, 255, 0.03));
      pointer-events: none;
    }

    .avatar-large {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #fff;
      box-shadow: var(--glow-blue);
      flex-shrink: 0;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.62rem, 1.8vw, 0.8rem);
      color: var(--text);
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .profile-email {
      font-size: clamp(0.42rem, 1.2vw, 0.52rem);
      color: var(--text-dim);
      margin-bottom: 16px;
      line-height: 1.8;
      word-break: break-word;
    }

    .badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: clamp(0.3rem, 0.95vw, 0.36rem);
      letter-spacing: 1px;
      line-height: 1.5;
      font-family: 'Press Start 2P', monospace;
    }

    .badge-role {
      background: linear-gradient(135deg, var(--purple), var(--blue));
      color: #fff;
    }

    .badge-role.admin {
      background: linear-gradient(135deg, #ff6600, var(--yellow));
    }

    .badge-level {
      border: 1px solid var(--blue);
      color: var(--blue);
      background: rgba(0, 170, 255, 0.08);
    }

    .badge-level.intermediate {
      border-color: var(--yellow);
      color: var(--yellow);
    }

    .badge-level.expert {
      border-color: #00ff88;
      color: #00ff88;
    }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: linear-gradient(135deg, rgba(20, 0, 40, 0.92), rgba(0, 22, 58, 0.9));
      border: 1px solid rgba(0, 170, 255, 0.32);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0, 100, 255, 0.15);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .stat-card:hover {
      border-color: var(--blue);
      box-shadow: var(--glow-blue);
      transform: translateY(-3px);
    }

    .stat-icon {
      font-size: 1.4rem;
      margin-bottom: 12px;
      color: var(--blue);
    }

    .stat-value {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.72rem, 1.8vw, 0.98rem);
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .stat-label {
      font-size: clamp(0.28rem, 0.9vw, 0.34rem);
      color: var(--text-dim);
      line-height: 1.8;
      font-family: 'Press Start 2P', monospace;
    }

    /* Games played section */
    .section-card {
      background: linear-gradient(135deg, rgba(20, 0, 40, 0.92), rgba(0, 22, 58, 0.9));
      border: 1px solid rgba(0, 170, 255, 0.28);
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 0 15px rgba(0, 100, 255, 0.15);
      position: relative;
      overflow: hidden;
    }

    .section-heading {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.45rem, 1.2vw, 0.56rem);
      color: var(--blue);
      margin-bottom: 20px;
      letter-spacing: 2px;
      border-bottom: 1px solid rgba(0, 100, 255, 0.3);
      padding-bottom: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-dim);
      font-size: clamp(0.38rem, 1.1vw, 0.44rem);
      line-height: 2.5;
    }

    .empty-state i {
      font-size: 2rem;
      display: block;
      margin-bottom: 16px;
      color: rgba(0, 170, 255, 0.45);
    }

    .game-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(0, 30, 60, 0.45);
      margin-bottom: 10px;
      border: 1px solid rgba(0, 80, 180, 0.28);
    }

    .game-item-icon {
      font-size: 1.2rem;
      color: var(--blue);
      width: 32px;
      text-align: center;
    }

    .game-item-name {
      font-size: clamp(0.38rem, 1.1vw, 0.44rem);
      color: var(--text);
      flex: 1;
      line-height: 1.8;
    }

    .game-item-badge {
      font-size: clamp(0.26rem, 0.9vw, 0.32rem);
      padding: 4px 8px;
      border-radius: 10px;
      background: rgba(0, 170, 255, 0.12);
      color: var(--blue);
      border: 1px solid rgba(0, 170, 255, 0.3);
      font-family: 'Press Start 2P', monospace;
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-dim);
      font-size: clamp(0.43rem, 1.2vw, 0.5rem);
      line-height: 2.5;
    }

    /* Logout button */
    .logout-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, rgba(255, 68, 68, 0.08), rgba(139, 0, 255, 0.08));
      border: 1px solid #ff4444;
      border-radius: 10px;
      color: #ff7777;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.44rem, 1.2vw, 0.5rem);
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .logout-btn:hover {
      background: rgba(255, 68, 68, 0.1);
      box-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
    }

    /* Loading spinner */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(0, 170, 255, 0.2);
      border-top-color: #00aaff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 22px 16px 40px;
      }

      .profile-card {
        flex-direction: column;
        text-align: center;
        padding: 28px 22px;
        gap: 20px;
      }

      .badges {
        justify-content: center;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .nav-back {
        font-size: 0.36rem;
        padding: 8px 12px;
      }

      .navbar {
        padding: 0 10px;
      }

      .nav-brand {
        font-size: 0.48rem;
      }
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>
  <canvas id="bgCanvas"></canvas>
  <div class="floating-coins" id="floatingCoins"></div>
  <div class="bg-elements" id="bgElements"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-brand" onclick="location.href='/index.html'">
      <img src="../../assets/logo_with_name.png" alt="FinGen" class="navbar-logo">
    </div>
    <button class="nav-back" onclick="location.href='/index.html'">
      ← BACK TO HOME
    </button>
  </nav>

  <!-- Main content -->
  <div class="container">
    <h1 class="page-title">MY PROFILE</h1>

    <div id="loadingState" class="loading">
      <div class="spinner"></div>
      Loading your profile...
    </div>

    <div id="profileContent" style="display:none">

      <!-- Profile Card -->
      <div class="profile-card">
        <div class="avatar-large" id="avatarLarge">?</div>
        <div class="profile-info">
          <div class="profile-name" id="profileName">--</div>
          <div class="profile-email" id="profileEmail">--</div>
          <div class="badges">
            <span class="badge badge-role" id="roleBadge">USER</span>
            <span class="badge badge-level" id="levelBadge">BEGINNER</span>
          </div>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-gamepad"></i></div>
          <div class="stat-value" id="gamesPlayedCount">0</div>
          <div class="stat-label">GAMES PLAYED</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-star"></i></div>
          <div class="stat-value" id="levelStat">--</div>
          <div class="stat-label">CURRENT LEVEL</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-calendar-alt"></i></div>
          <div class="stat-value" id="memberSince">--</div>
          <div class="stat-label">MEMBER SINCE</div>
        </div>
      </div>

      <!-- Games Played -->
      <div class="section-card">
        <div class="section-heading">🎮 GAMES PLAYED</div>
        <div id="gamesPlayedList">
          <div class="empty-state">
            <i class="fas fa-ghost"></i>
            No games played yet!<br/>
            Head back and start playing!
          </div>
        </div>
      </div>

      <!-- Logout -->
      <button class="logout-btn" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> LOGOUT
      </button>

    </div>
  </div>

  <script type="module">
    import { auth, db } from "../firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const canvas = document.getElementById('bgCanvas');
    const context = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function drawBackground() {
      const width = canvas.width;
      const height = canvas.height;
      context.clearRect(0, 0, width, height);
      const gradient = context.createRadialGradient(width * 0.2, height * 0.2, 0, width * 0.2, height * 0.2, width * 0.75);
      gradient.addColorStop(0, 'rgba(180, 79, 255, 0.18)');
      gradient.addColorStop(1, 'rgba(180, 79, 255, 0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);

      requestAnimationFrame(drawBackground);
    }
    drawBackground();

    // Floating background
    const icons = ['💰','📈','💳','🏦','💵','📊','🪙','💹'];
    const bg = document.getElementById('bgElements');
    for (let i = 0; i < 18; i++) {
      const el = document.createElement('div');
      el.className = 'floating-icon';
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (8 + Math.random() * 12) + 's';
      el.style.animationDelay = (Math.random() * 10) + 's';
      el.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
      bg.appendChild(el);
    }

    const floatingCoins = document.getElementById('floatingCoins');
    const coinIcons = ['💰', '🪙', '💎', '📈'];
    for (let i = 0; i < 12; i++) {
      const coin = document.createElement('div');
      coin.className = 'floating-icon';
      coin.textContent = coinIcons[i % coinIcons.length];
      coin.style.left = Math.random() * 100 + '%';
      coin.style.animationDuration = (10 + Math.random() * 14) + 's';
      coin.style.animationDelay = (Math.random() * 8) + 's';
      coin.style.fontSize = (1 + Math.random() * 1.2) + 'rem';
      floatingCoins.appendChild(coin);
    }

    const gameNames = {
      'game1': { name: 'Grocery Grab', icon: '🛒' },
      'game2': { name: 'Haunted Escape Room', icon: '👻' },
      'game3': { name: 'Recession Run', icon: '📈' },
      'game4': { name: 'Mahjong Money', icon: '🀄' },
      'game5': { name: 'Finance Snake & Ladder', icon: '🎲' },
      'game6': { name: 'UNO Investment Strategy', icon: '🃏' },
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // Not logged in → redirect to login
        window.location.href = '/frontend/auth/login.html';
        return;
      }

      const docSnap = await getDoc(doc(db, "users", user.uid));

      if (docSnap.exists()) {
        const data = docSnap.data();

        // Hide loading, show content
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('profileContent').style.display = 'block';

        // Avatar
        document.getElementById('avatarLarge').textContent = data.name.charAt(0).toUpperCase();

        // Name & email
        document.getElementById('profileName').textContent = data.name;
        document.getElementById('profileEmail').textContent = data.email;

        // Role badge
        const roleBadge = document.getElementById('roleBadge');
        roleBadge.textContent = data.role.toUpperCase();
        if (data.role === 'admin') roleBadge.classList.add('admin');

        // Level badge
        const levelBadge = document.getElementById('levelBadge');
        const levelStat = document.getElementById('levelStat');
        levelBadge.textContent = data.level.toUpperCase();
        levelStat.textContent = data.level;
        if (data.level === 'Intermediate') {
          levelBadge.classList.add('intermediate');
        } else if (data.level === 'Expert') {
          levelBadge.classList.add('expert');
        }

        // Stats
        const gamesPlayed = data.gamesPlayed || [];
        const uniqueIds = new Set(gamesPlayed.map(e => typeof e === 'object' ? e.gameId : e));
document.getElementById('gamesPlayedCount').textContent = uniqueIds.size;

        // Member since
        if (data.createdAt) {
          const date = new Date(data.createdAt);
          document.getElementById('memberSince').textContent =
            date.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' });
        }

        // Games list
        const listEl = document.getElementById('gamesPlayedList');
if (gamesPlayed.length > 0) {
  // Deduplicate by gameId in case same game appears multiple times
  const seen = new Set();
  const uniqueGames = gamesPlayed.filter(entry => {
    const id = typeof entry === 'object' ? entry.gameId : entry;
    if (seen.has(id)) return false;
    seen.add(id);
    return true;
  });

  listEl.innerHTML = uniqueGames.map(entry => {
    // Handle both old format (plain string) and new format (object)
    const gameId = typeof entry === 'object' ? entry.gameId : entry;
    const gameName = typeof entry === 'object' ? entry.gameName : null;
    const result = typeof entry === 'object' ? entry.result : null;

    const game = gameNames[gameId] || { name: gameName || gameId, icon: '🎮' };

    const resultBadge = result === 'win' ? '🏆 WON' :
                        result === 'lose' ? '😢 LOST' :
                        result === 'gameover' ? '💀 GAME OVER' :
                        result === 'complete' ? '✅ COMPLETE' : 'PLAYED';

    return `
      <div class="game-item">
        <div class="game-item-icon">${game.icon}</div>
        <div class="game-item-name">${game.name}</div>
        <div class="game-item-badge">${resultBadge}</div>
      </div>`;
  }).join('');
}
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = '/frontend/auth/login.html';
    });
  </script>
</body>
</html>
