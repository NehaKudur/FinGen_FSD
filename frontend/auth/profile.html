<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinGen – My Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #000010;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      font-size: 17px;
      overflow-x: hidden;
    }

    /* Floating background */
    .bg-elements {
      position: fixed;
      width: 100%; height: 100%;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 0;
    }

    .floating-icon {
      position: absolute;
      opacity: 0.1;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.1; }
      90%  { opacity: 0.1; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 32px;
      background: rgba(0, 5, 20, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 100, 255, 0.3);
    }

    .nav-brand {
      font-size: 0.95rem;
      background: linear-gradient(90deg, #00aaff, #0044ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }

    .nav-back {
      font-size: 0.42rem;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #00aaff;
      background: transparent;
      color: #00aaff;
      font-family: 'Press Start 2P', monospace;
      transition: all 0.3s;
    }

    .nav-back:hover {
      background: rgba(0, 170, 255, 0.1);
      box-shadow: 0 0 10px rgba(0, 170, 255, 0.3);
    }

    /* Main content */
    .container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 100px 24px 60px;
    }

    .page-title {
      font-size: clamp(0.88rem, 2vw, 1rem);
      text-align: center;
      margin-bottom: 40px;
      background: linear-gradient(90deg, #00aaff, #0044ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      line-height: 1.5;
    }

    /* Profile card */
    .profile-card {
      background: rgba(0, 10, 30, 0.85);
      border: 2px solid #0044ff;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 0 40px rgba(0, 100, 255, 0.2);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .avatar-large {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0044ff, #00aaff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #fff;
      box-shadow: 0 0 25px rgba(0, 170, 255, 0.5);
      flex-shrink: 0;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: clamp(0.72rem, 2vw, 0.84rem);
      color: #fff;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .profile-email {
      font-size: clamp(0.42rem, 1.2vw, 0.5rem);
      color: #88ccff;
      margin-bottom: 16px;
      line-height: 1.8;
      word-break: break-word;
    }

    .badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: clamp(0.32rem, 1vw, 0.38rem);
      letter-spacing: 1px;
      line-height: 1.5;
    }

    .badge-role {
      background: linear-gradient(135deg, #0044ff, #00aaff);
      color: #fff;
    }

    .badge-role.admin {
      background: linear-gradient(135deg, #ff6600, #ffaa00);
    }

    .badge-level {
      border: 1px solid #00aaff;
      color: #00aaff;
    }

    .badge-level.intermediate {
      border-color: #ffaa00;
      color: #ffaa00;
    }

    .badge-level.expert {
      border-color: #00ff88;
      color: #00ff88;
    }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: rgba(0, 10, 30, 0.85);
      border: 1px solid #0044ff;
      border-radius: 14px;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0, 100, 255, 0.15);
      transition: all 0.3s;
    }

    .stat-card:hover {
      border-color: #00aaff;
      box-shadow: 0 0 25px rgba(0, 170, 255, 0.3);
      transform: translateY(-3px);
    }

    .stat-icon {
      font-size: 1.4rem;
      margin-bottom: 12px;
      color: #00aaff;
    }

    .stat-value {
      font-size: clamp(0.9rem, 2vw, 1.02rem);
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .stat-label {
      font-size: clamp(0.3rem, 0.95vw, 0.36rem);
      color: #88ccff;
      line-height: 1.8;
    }

    /* Games played section */
    .section-card {
      background: rgba(0, 10, 30, 0.85);
      border: 1px solid #0044ff;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 0 15px rgba(0, 100, 255, 0.15);
    }

    .section-heading {
      font-size: clamp(0.52rem, 1.4vw, 0.6rem);
      color: #00aaff;
      margin-bottom: 20px;
      letter-spacing: 2px;
      border-bottom: 1px solid rgba(0, 100, 255, 0.3);
      padding-bottom: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: #445566;
      font-size: clamp(0.38rem, 1.1vw, 0.44rem);
      line-height: 2.5;
    }

    .empty-state i {
      font-size: 2rem;
      display: block;
      margin-bottom: 16px;
      color: #223344;
    }

    .game-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(0, 30, 60, 0.5);
      margin-bottom: 10px;
      border: 1px solid rgba(0, 80, 180, 0.3);
    }

    .game-item-icon {
      font-size: 1.2rem;
      color: #00aaff;
      width: 32px;
      text-align: center;
    }

    .game-item-name {
      font-size: clamp(0.38rem, 1.1vw, 0.44rem);
      color: #fff;
      flex: 1;
      line-height: 1.8;
    }

    .game-item-badge {
      font-size: clamp(0.26rem, 0.9vw, 0.32rem);
      padding: 4px 8px;
      border-radius: 10px;
      background: rgba(0, 170, 255, 0.15);
      color: #00aaff;
      border: 1px solid rgba(0, 170, 255, 0.3);
    }

    /* Loading state */
    .loading {
      text-align: center;
      padding: 60px;
      color: #445566;
      font-size: clamp(0.43rem, 1.2vw, 0.5rem);
      line-height: 2.5;
    }

    /* Logout button */
    .logout-btn {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid #ff4444;
      border-radius: 10px;
      color: #ff4444;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.44rem, 1.2vw, 0.5rem);
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .logout-btn:hover {
      background: rgba(255, 68, 68, 0.1);
      box-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
    }

    /* Loading spinner */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(0, 170, 255, 0.2);
      border-top-color: #00aaff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 92px 16px 40px;
      }

      .profile-card {
        flex-direction: column;
        text-align: center;
        padding: 28px 22px;
        gap: 20px;
      }

      .badges {
        justify-content: center;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .nav-back {
        font-size: 0.36rem;
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-elements" id="bgElements"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-brand" onclick="location.href='/index.html'">💰 FinGen</div>
    <button class="nav-back" onclick="location.href='/index.html'">
      ← BACK TO HOME
    </button>
  </nav>

  <!-- Main content -->
  <div class="container">
    <h1 class="page-title">MY PROFILE</h1>

    <div id="loadingState" class="loading">
      <div class="spinner"></div>
      Loading your profile...
    </div>

    <div id="profileContent" style="display:none">

      <!-- Profile Card -->
      <div class="profile-card">
        <div class="avatar-large" id="avatarLarge">?</div>
        <div class="profile-info">
          <div class="profile-name" id="profileName">--</div>
          <div class="profile-email" id="profileEmail">--</div>
          <div class="badges">
            <span class="badge badge-role" id="roleBadge">USER</span>
            <span class="badge badge-level" id="levelBadge">BEGINNER</span>
          </div>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-gamepad"></i></div>
          <div class="stat-value" id="gamesPlayedCount">0</div>
          <div class="stat-label">GAMES PLAYED</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-star"></i></div>
          <div class="stat-value" id="levelStat">--</div>
          <div class="stat-label">CURRENT LEVEL</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-calendar-alt"></i></div>
          <div class="stat-value" id="memberSince">--</div>
          <div class="stat-label">MEMBER SINCE</div>
        </div>
      </div>

      <!-- Games Played -->
      <div class="section-card">
        <div class="section-heading">🎮 GAMES PLAYED</div>
        <div id="gamesPlayedList">
          <div class="empty-state">
            <i class="fas fa-ghost"></i>
            No games played yet!<br/>
            Head back and start playing!
          </div>
        </div>
      </div>

      <!-- Logout -->
      <button class="logout-btn" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> LOGOUT
      </button>

    </div>
  </div>

  <script type="module">
    import { auth, db } from "../firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    // Floating background
    const icons = ['💰','📈','💳','🏦','💵','📊','🪙','💹'];
    const bg = document.getElementById('bgElements');
    for (let i = 0; i < 18; i++) {
      const el = document.createElement('div');
      el.className = 'floating-icon';
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (8 + Math.random() * 12) + 's';
      el.style.animationDelay = (Math.random() * 10) + 's';
      el.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
      bg.appendChild(el);
    }

    const gameNames = {
      'game1': { name: 'Grocery Grab', icon: '🛒' },
      'game2': { name: 'Haunted Escape Room', icon: '👻' },
      'game3': { name: 'Recession Run', icon: '📈' },
      'game4': { name: 'Mahjong Money', icon: '🀄' },
      'game5': { name: 'Finance Snake & Ladder', icon: '🎲' },
      'game6': { name: 'UNO Investment Strategy', icon: '🃏' },
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // Not logged in → redirect to login
        window.location.href = '/frontend/auth/login.html';
        return;
      }

      const docSnap = await getDoc(doc(db, "users", user.uid));

      if (docSnap.exists()) {
        const data = docSnap.data();

        // Hide loading, show content
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('profileContent').style.display = 'block';

        // Avatar
        document.getElementById('avatarLarge').textContent = data.name.charAt(0).toUpperCase();

        // Name & email
        document.getElementById('profileName').textContent = data.name;
        document.getElementById('profileEmail').textContent = data.email;

        // Role badge
        const roleBadge = document.getElementById('roleBadge');
        roleBadge.textContent = data.role.toUpperCase();
        if (data.role === 'admin') roleBadge.classList.add('admin');

        // Level badge
        const levelBadge = document.getElementById('levelBadge');
        const levelStat = document.getElementById('levelStat');
        levelBadge.textContent = data.level.toUpperCase();
        levelStat.textContent = data.level;
        if (data.level === 'Intermediate') {
          levelBadge.classList.add('intermediate');
        } else if (data.level === 'Expert') {
          levelBadge.classList.add('expert');
        }

        // Stats
        const gamesPlayed = data.gamesPlayed || [];
        document.getElementById('gamesPlayedCount').textContent = gamesPlayed.length;

        // Member since
        if (data.createdAt) {
          const date = new Date(data.createdAt);
          document.getElementById('memberSince').textContent =
            date.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' });
        }

        // Games list
        const listEl = document.getElementById('gamesPlayedList');
        if (gamesPlayed.length > 0) {
          listEl.innerHTML = gamesPlayed.map(gameKey => {
            const game = gameNames[gameKey] || { name: gameKey, icon: '🎮' };
            return `
              <div class="game-item">
                <div class="game-item-icon">${game.icon}</div>
                <div class="game-item-name">${game.name}</div>
                <div class="game-item-badge">PLAYED</div>
              </div>`;
          }).join('');
        }
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = '/frontend/auth/login.html';
    });
  </script>
</body>
</html>
