<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINGEN - Finance Bingo</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    :root {
      --primary: #8b00ff;
      --primary-dark: #6100b3;
      --primary-light: #b44fff;
      --secondary: #00aaff;
      --accent: #FFD700;
      --background: #0d0015;
      --surface: rgba(20, 0, 40, 0.88);
      --text: #f0e8ff;
      --text-secondary: #c4a9e8;
      --success: #00ffcc;
      --warning: #FFAA00;
      --danger: #ff3399;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }
    
    body {
      background: radial-gradient(circle at 15% 20%, rgba(180, 79, 255, 0.22) 0%, transparent 35%), radial-gradient(circle at 85% 70%, rgba(0, 170, 255, 0.14) 0%, transparent 30%), linear-gradient(135deg, var(--background) 0%, #07000d 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }
    
    .game-container {
      width: 100%;
      max-width: 900px;
      background: var(--surface);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(180, 79, 255, 0.3);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(180, 79, 255, 0.45);
      position: relative;
      overflow: hidden;
    }
    
    .game-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(180, 79, 255, 0.14) 0%, rgba(20, 0, 40, 0) 70%);
      z-index: -1;
    }
    
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid rgba(180, 79, 255, 0.4);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 28px;
      font-weight: 800;
      font-family: 'Press Start 2P', monospace;
      color: var(--text);
      text-shadow: 0 0 10px rgba(0, 170, 255, 0.5);
    }
    
    .logo i {
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent);
    }
    
    .budget-display {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      padding: 12px 20px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 18px rgba(0, 170, 255, 0.35);
      animation: pulse 2s infinite;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    .bingo-board-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
    }
    
    .bingo-header {
      display: flex;
      justify-content: center;
      gap: 15px;
      font-size: 2.5rem;
      font-weight: 900;
      font-family: 'Press Start 2P', monospace;
      color: var(--text);
      text-shadow: 0 0 10px rgba(0, 170, 255, 0.5);
      margin-bottom: 10px;
    }
    
    .bingo-header .letter {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
    }
    
    #bingo-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
    
    .tile {
      aspect-ratio: 1;
      background: linear-gradient(135deg, var(--surface) 0%, #00163a 100%);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
    }
    
    .tile::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(0, 68, 255, 0.12) 0%, rgba(0, 170, 255, 0.12) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .tile:hover::before {
      opacity: 1;
    }
    
    .tile:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 16px rgba(0, 170, 255, 0.35);
      border-color: var(--secondary);
    }
    
    .tile.clicked {
      background: linear-gradient(135deg, var(--success) 0%, #00AA70 100%);
      color: white;
      transform: scale(0.95);
      box-shadow: 0 0 20px rgba(0, 204, 136, 0.5);
    }
    
    .tile.processing {
      background: linear-gradient(135deg, var(--warning) 0%, #FF9900 100%);
      color: white;
      animation: processing 1.5s infinite;
    }
    
    @keyframes processing {
      0% { transform: scale(1); }
      50% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    
    .game-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
    }
    
    .draw-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    
    #draw-ball {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 18px rgba(0, 170, 255, 0.35);
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.62rem;
    }
    
    #draw-ball:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 24px rgba(0, 170, 255, 0.55);
    }
    
    #draw-ball:active {
      transform: translateY(1px);
    }
    
    #draw-ball:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .drawn-number-container {
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(0, 24, 58, 0.7);
      padding: 15px 25px;
      border-radius: 50px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 100, 255, 0.35);
    }
    
    .drawn-number-label {
      font-size: 16px;
      color: var(--text-secondary);
    }
    
    #drawn-number {
      font-size: 28px;
      font-weight: bold;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }
    
    .result-display {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      background: rgba(0, 24, 58, 0.65);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 100, 255, 0.35);
    }
    
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 5, 20, 0.92);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }
    
    .modal.hidden {
      display: none;
    }
    
    .modal-content {
      background: linear-gradient(135deg, var(--surface) 0%, #00163a 100%);
      width: 90%;
      max-width: 500px;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 100, 255, 0.45);
      position: relative;
      animation: modalAppear 0.3s ease;
    }
    
    @keyframes modalAppear {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .modal-title {
      font-size: 22px;
      font-weight: bold;
      color: var(--text);
      font-family: 'Press Start 2P', monospace;
    }
    
    .close-button {
      font-size: 24px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: color 0.3s;
    }
    
    .close-button:hover {
      color: var(--text);
    }
    
    #question-text {
      font-size: 18px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    
    #options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .option-btn {
      background: rgba(0, 24, 58, 0.75);
      border: 1px solid rgba(0, 100, 255, 0.35);
      padding: 15px;
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .option-btn:hover {
      background: rgba(0, 68, 255, 0.22);
      border-color: var(--secondary);
      transform: translateX(5px);
    }
    
    .close-modal-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      float: right;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
    }
    
    .close-modal-btn:hover {
      background: var(--primary-dark);
    }
    
    #ai-feedback-panel {
      margin-top: 30px;
      padding: 25px;
      background: linear-gradient(135deg, var(--surface) 0%, #00163a 100%);
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 100, 255, 0.35);
    }
    
    #ai-feedback-panel.hidden {
      display: none;
    }
    
    .feedback-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .feedback-header h2 {
      font-size: 24px;
      font-family: 'Press Start 2P', monospace;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
    }
    
    .loading-spinner.hidden {
      display: none;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .insight {
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 12px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    
    .insight.good {
      background: rgba(0, 204, 136, 0.1);
      border-left: 4px solid var(--success);
    }
    
    .insight.warning {
      background: rgba(255, 170, 0, 0.1);
      border-left: 4px solid var(--warning);
    }
    
    .insight.bad {
      background: rgba(255, 55, 95, 0.1);
      border-left: 4px solid var(--danger);
    }
    
    .insight-icon {
      font-size: 20px;
    }
    
    .insight.good .insight-icon {
      color: var(--success);
    }
    
    .insight.warning .insight-icon {
      color: var(--warning);
    }
    
    .insight.bad .insight-icon {
      color: var(--danger);
    }
    
    .insight-content {
      flex: 1;
    }
    
    #ai-lesson {
      background: rgba(0, 212, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      border-left: 4px solid var(--secondary);
    }
    
    #lesson-title {
      color: var(--secondary);
      margin-bottom: 10px;
      font-size: 18px;
    }
    
    #ai-summary {
      font-style: italic;
      color: var(--text-secondary);
      margin: 20px 0;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
    }
    
    #restart-game {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      display: block;
      margin: 0 auto;
      box-shadow: 0 0 18px rgba(0, 170, 255, 0.35);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.58rem;
    }
    
    #restart-game:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 24px rgba(0, 170, 255, 0.55);
    }
    
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    
    .particle {
      position: absolute;
      background: var(--secondary);
      border-radius: 50%;
      opacity: 0.3;
      animation: float 15s infinite linear;
    }
    
    @keyframes float {
      0% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-20px) translateX(10px); }
      100% { transform: translateY(0) translateX(0); }
    }
    
    .stats-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding: 15px;
      background: rgba(0, 24, 58, 0.65);
      border-radius: 12px;
      border: 1px solid rgba(0, 100, 255, 0.35);
    }
    
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: var(--accent);
    }
    
    .stat-label {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .agent-test-section button {
      background: linear-gradient(135deg, #0044ff 0%, #00aaff 100%) !important;
      box-shadow: 0 0 18px rgba(0, 170, 255, 0.35) !important;
      font-family: 'Press Start 2P', monospace !important;
      font-size: 0.52rem !important;
      border: 1px solid rgba(0, 100, 255, 0.4) !important;
    }

    .agent-test-section button:hover {
      box-shadow: 0 0 24px rgba(0, 170, 255, 0.55) !important;
    }

    .agent-test-section button i {
      margin-right: 10px !important;
    }
    
    @media (max-width: 768px) {
      .game-container {
        padding: 20px;
      }
      
      .game-header {
        flex-direction: column;
        gap: 15px;
      }
      
      .bingo-header {
        font-size: 2rem;
      }
      
      #bingo-board {
        gap: 8px;
      }
      
      .tile {
        font-size: 18px;
      }
      
      .modal-content {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="game-container">
    <div class="game-header">
      <div class="logo">
        <i class="fas fa-coins"></i>
        <span>FINGEN</span>
      </div>
      <div class="budget-display">
        <i class="fas fa-wallet"></i>
        <span id="budget-display">Budget: ₹3000</span>
      </div>
    </div>
    
    <div class="bingo-board-container">
      <div class="bingo-header">
        <span class="letter">B</span>
        <span class="letter">I</span>
        <span class="letter">N</span>
        <span class="letter">G</span>
        <span class="letter">O</span>
      </div>
      
      <div id="bingo-board" class="bingo-board"></div>
      
      <div class="game-controls">
        <div class="draw-section">
          <button id="draw-ball">
            <i class="fas fa-dice"></i>
            Draw Bingo Ball
          </button>
          
          <div class="drawn-number-container">
            <span class="drawn-number-label">Current Number:</span>
            <div id="drawn-number" class="drawn-number"></div>
          </div>
        </div>
        
        <div id="result-display" class="result-display"></div>
      </div>
    </div>
    
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="tiles-clicked">0</div>
        <div class="stat-label">Tiles Played</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="money-saved">₹0</div>
        <div class="stat-label">Money Saved</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="wise-choices">0</div>
        <div class="stat-label">Wise Choices</div>
      </div>
    </div>

    <!-- Agent Test Button -->
    <div class="agent-test-section" style="text-align: center; margin: 30px 0;">
      <button onclick="window.open('https://msrit.adya.ai/agent-studio/projects/view/501211/flow/502065', '_blank')"
              style="background: linear-gradient(135deg, #00D4FF 0%, #8A2BE2 100%); color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);">
        <i class="fas fa-robot" style="margin-right: 10px;"></i>
        Test Your Knowledge with the Agent
      </button>
    </div>

    <!-- Question Modal -->
    <div id="question-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">Financial Decision</div>
          <span class="close-button">×</span>
        </div>
        <p id="question-text">Question goes here...</p>
        <div id="options-container"></div>
        <button class="close-modal-btn">Close</button>
      </div>
    </div>
    
    <!-- AI Feedback Panel -->
    <div id="ai-feedback-panel" class="hidden">
      <div class="feedback-header">
        <i class="fas fa-robot"></i>
        <h2>AI Financial Insights</h2>
      </div>
      
      <div class="loading-spinner hidden">
        <div class="spinner"></div>
        <p>Analyzing your financial decisions...</p>
      </div>
      
      <div id="ai-feedback-content">
        <div id="ai-insights"></div>
        <div id="ai-lesson">
          <h3 id="lesson-title"></h3>
          <p id="lesson-content"></p>
        </div>
        <div id="ai-summary"></div>
      </div>
      
      <button id="restart-game" class="primary-button">
        <i class="fas fa-redo"></i>
        Play Again
      </button>
    </div>
  </div>

  <script>
    // Finance Bingo Game - Prompt Bank
    const promptBank = [
      {
        number: 1,
        tile: "Buy Apples",
        scenario: "Your friends say you should eat more fruits. You decide to get apples.",
        options: [
          { label: "Imported Apples – ₹180", cost: 180 },

      {

          { label: "Split with Friends – ₹150", cost: 150 },
          { label: "Skip It", cost: 0 }

      },
      {
        number: 3,

      {
        number: 4,

        scenario: "You're craving snacks while watching TV. What do you do?",

          { label: "Skip", cost: 0 }

      },
      {
        number: 5,
        tile: "Monthly Groceries",
        scenario: "It's time for your monthly grocery stock-up.",
        options: [
          { label: "Buy in Bulk – ₹500 (saves ₹100)", cost: 500 },
          { label: "Buy Week-by-Week – ₹150 x 4 = ₹600", cost: 600 }
        ]
      },
      {
        number: 6,
        tile: "Buy Toothpaste",
        scenario: "You're low on toothpaste. Time to restock.",
        options: [
          { label: "Big Pack – ₹120 (lasts longer)", cost: 120 },
          { label: "Small Tube – ₹50", cost: 50 }
        ]
      },
      {
        number: 7,
        tile: "Online Sale Temptation",
        scenario: "There's a HUGE online sale going on. Do you splurge?",
        options: [
          { label: "Buy Clothes – ₹800", cost: 800 },
          { label: "Just Window Shop – ₹0", cost: 0 }
        ]
      },
      {
        number: 8,
        tile: "Buy Milk",
        scenario: "You need milk for tea/coffee every day.",
        options: [
          { label: "Daily Pack – ₹40", cost: 40 },
          { label: "Monthly Subscription – ₹900 (₹30/day)", cost: 900 }
        ]
      },
      {
        number: 9,
        tile: "Go Out for Dinner",
        scenario: "Your friends invite you for dinner at a fancy place.",

    // Wait for DOM to fully load before initializing
    document.addEventListener('DOMContentLoaded', function() {
      console.log("DOM fully loaded, initializing bingo game");
      
      // Game state
      let budget = 3000;
      let currentNumber = null;
      let drawnNumbers = new Set();
      let selectedTiles = new Set();
      let tilesClicked = 0;
      let moneySaved = 0;
      let wiseChoices = 0;
      
      // Get DOM elements
      const bingoBoard = document.getElementById('bingo-board');
      const drawButton = document.getElementById('draw-ball');
      const drawnNumberDisplay = document.getElementById('drawn-number');
      const budgetDisplay = document.getElementById('budget-display');
      const resultDisplay = document.getElementById('result-display');
      const questionModal = document.getElementById('question-modal');
      const questionText = document.getElementById('question-text');
      const optionsContainer = document.getElementById('options-container');
      const aiFeedbackPanel = document.getElementById('ai-feedback-panel');
      const loadingSpinner = document.querySelector('.loading-spinner');
      const aiFeedbackContent = document.getElementById('ai-feedback-content');
      const aiInsights = document.getElementById('ai-insights');
      const lessonTitle = document.getElementById('lesson-title');
      const lessonContent = document.getElementById('lesson-content');
      const aiSummary = document.getElementById('ai-summary');
      const restartGame = document.getElementById('restart-game');
      const tilesClickedDisplay = document.getElementById('tiles-clicked');
      const moneySavedDisplay = document.getElementById('money-saved');
      const wiseChoicesDisplay = document.getElementById('wise-choices');
      
      // Create background particles
      function createParticles() {
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
          const particle = document.createElement('div');
          particle.classList.add('particle');
          particle.style.width = `${Math.random() * 10 + 5}px`;
          particle.style.height = particle.style.width;
          particle.style.left = `${Math.random() * 100}%`;
          particle.style.top = `${Math.random() * 100}%`;
          particle.style.background = `rgba(${Math.random() * 100 + 100}, ${Math.random() * 100 + 50}, ${Math.random() * 100 + 150}, ${Math.random() * 0.3 + 0.1})`;
          particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
          particlesContainer.appendChild(particle);
        }
      }
      
      // Update budget display
      function updateBudgetDisplay() {
        budgetDisplay.textContent = `Budget: ₹${budget}`;
      }
      
      // Update stats display
      function updateStatsDisplay() {
        tilesClickedDisplay.textContent = tilesClicked;
        moneySavedDisplay.textContent = `₹${moneySaved}`;
        wiseChoicesDisplay.textContent = wiseChoices;
      }
      
      // Generate a randomized board
      function createBoard() {
        // Generate random numbers 1-25
        const numbers = Array.from({length: 25}, (_, i) => i + 1);
        for (let i = numbers.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
        }
        
        // Create the visual board
        bingoBoard.innerHTML = '';
        numbers.forEach(num => {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.textContent = num;
          tile.dataset.number = num;
          
          // Set click handler
          tile.addEventListener('click', function() {
            handleTileClick(num, tile);
          });
          
          bingoBoard.appendChild(tile);
        });
        
        return numbers;
      }
      
      // Handle tile clicks
      function handleTileClick(number, tileElement) {
        console.log(`Tile ${number} clicked. Current drawn number: ${currentNumber}`);
        
        // Can only select the current drawn number
        if (number != currentNumber || selectedTiles.has(number)) {
          console.log("Cannot select this tile now");
          return;
        }
        
        // Find prompt for this number
        const prompt = promptBank.find(p => p.number === number);
        if (!prompt) {
          console.error(`No prompt found for number ${number}`);
          return;
        }
        
        // Mark the tile as being processed
        tileElement.classList.add('processing');
        
        // Show the scenario in the modal
        openScenarioModal(prompt, tileElement);
      }
      
      // Open the scenario modal with the prompt
      function openScenarioModal(prompt, tileElement) {
        console.log("Opening modal with prompt:", prompt);
        
        questionText.textContent = prompt.scenario;
        optionsContainer.innerHTML = '';
        
        // Create buttons for each option
        prompt.options.forEach(option => {
          const button = document.createElement('button');
          button.textContent = option.label;
          button.className = 'option-btn';
          
          button.addEventListener('click', function() {
            handleOptionSelection(prompt.number, option, tileElement);
          });
          
          optionsContainer.appendChild(button);
        });
        
        // Show the modal
        questionModal.classList.remove('hidden');
      }
      
      // Track choices made in the game
      const playerChoices = new Map();
      
      // Handle option selection
      function handleOptionSelection(tileNumber, option, tileElement) {
        console.log(`Selected option: ${option.label} costing ₹${option.cost}`);
        
        // Check if we can afford it
        if (budget < option.cost) {
          resultDisplay.textContent = "Game Over: You can't afford this!";
          resultDisplay.style.background = "rgba(255, 55, 95, 0.2)";
          resultDisplay.style.color = "var(--danger)";
          drawButton.disabled = true;
          closeModal();
          // Show AI feedback when game ends
          setTimeout(() => {
            saveGameAndGetFeedback();
          }, 1500);
          return;
        }
        
        // Update budget
        budget -= option.cost;
        updateBudgetDisplay();
        
        // Update stats
        tilesClicked++;
        
        // Check if this was a wise choice (lowest cost option)
        const prompt = promptBank.find(p => p.number === tileNumber);
        const minCost = Math.min(...prompt.options.map(o => o.cost));
        if (option.cost === minCost) {
          wiseChoices++;
          moneySaved += (Math.max(...prompt.options.map(o => o.cost)) - minCost);
        }
        
        updateStatsDisplay();
        
        // Store the choice made for this tile
        playerChoices.set(tileNumber, option);
        
        // Mark as selected
        selectedTiles.add(tileNumber);
        tileElement.classList.remove('processing');
        tileElement.classList.add('clicked');
        
        // Reset current number
        currentNumber = null;
        drawnNumberDisplay.textContent = '';
        
        // Close the modal
        closeModal();
        
        // Check for bingo
        if (checkBingo()) {
          resultDisplay.textContent = "🎉 Bingo! You win!";
          resultDisplay.style.background = "rgba(0, 204, 136, 0.2)";
          resultDisplay.style.color = "var(--success)";
          drawButton.disabled = true;
          // Show AI feedback when game ends
          setTimeout(() => {
            saveGameAndGetFeedback();
          }, 1500);
        }
      }
      
      // Close the modal
      function closeModal() {
        questionModal.classList.add('hidden');
      }
      
      // Draw a new bingo ball
      function drawBall() {
        console.log("Drawing a new ball");
        
        // If a number is already drawn but not selected, don't draw a new one
        if (currentNumber !== null) {
          console.log("Cannot draw a new number until current one is processed");
          return;
        }
        
        // Get numbers not yet drawn
        const remainingNumbers = Array.from({length: 25}, (_, i) => i + 1)
          .filter(n => !drawnNumbers.has(n));
        
        if (remainingNumbers.length === 0) {
          drawnNumberDisplay.textContent = "All numbers drawn!";
          return;
        }
        
        // Draw a random number
        const randomIndex = Math.floor(Math.random() * remainingNumbers.length);
        const drawnNumber = remainingNumbers[randomIndex];
        
        // Update state
        currentNumber = drawnNumber;
        drawnNumbers.add(drawnNumber);
        
        // Update display
        drawnNumberDisplay.textContent = drawnNumber;
        console.log(`Drew number ${drawnNumber}`);
      }
      
      // Check if player has achieved bingo
      function checkBingo() {
        // Convert selectedTiles to a board layout
        const board = [];
        const boardSize = 5;
        
        // Find all tiles
        const allTiles = Array.from(bingoBoard.querySelectorAll('.tile'));
        
        // Create 5x5 grid representation
        for (let row = 0; row < boardSize; row++) {
          const boardRow = [];
          for (let col = 0; col < boardSize; col++) {
            const index = row * boardSize + col;
            const tileNumber = parseInt(allTiles[index].dataset.number);
            boardRow.push(selectedTiles.has(tileNumber));
          }
          board.push(boardRow);
        }
        
        // Check rows
        for (let i = 0; i < boardSize; i++) {
          if (board[i].every(cell => cell)) return true;
        }
        
        // Check columns
        for (let i = 0; i < boardSize; i++) {
          const column = board.map(row => row[i]);
          if (column.every(cell => cell)) return true;
        }
        
        // Check diagonals
        const diagonal1 = Array.from({length: boardSize}, (_, i) => board[i][i]);
        const diagonal2 = Array.from({length: boardSize}, (_, i) => board[i][boardSize - 1 - i]);
        
        if (diagonal1.every(cell => cell)) return true;
        if (diagonal2.every(cell => cell)) return true;
        
        return false;
      }
      
      // Get game summary for AI analysis
      function getGameSummary() {
        const choices = [];
        
        // Find all choices made during the game
        selectedTiles.forEach(number => {
          const prompt = promptBank.find(p => p.number === number);
          const selectedOption = playerChoices.get(number);
          
          if (prompt && selectedOption) {
            const choice = {
              tileNumber: number,
              tileName: prompt.tile,
              scenario: prompt.scenario,
              choice: selectedOption.label,
              cost: selectedOption.cost
            };
            
            choices.push(choice);
          }
        });
        
        return {
          startingBudget: 3000,
          remainingBudget: budget,
          totalSpent: 3000 - budget,
          choices: choices,
          outcome: checkBingo() ? "WIN" : (budget <= 0 ? "LOSS" : "ONGOING")
        };
      }
      
      // AI Feedback Functions
      async function saveGameAndGetFeedback() {
        showLoading();
        const summary = getGameSummary();
        
        try {
          // Try API first
          const response = await callFinanceAPI(summary);
          displayFeedback({
            insights: formatAPIResponse(response),
            source: "AI Financial Advisor"
          });
        } catch (error) {
          console.warn("API Failed. Using local analysis:", error);
          // Fallback to local analysis
          displayFeedback({
            insights: generateLocalAnalysis(summary).insights,
            source: "Local Analysis"
          });
        }
      }
      
      async function callFinanceAPI(summary) {
        // Simulate API call with timeout
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            // In a real implementation, this would be an actual API call
            // For demo purposes, we'll simulate a response
            const simulatedResponse = `
            Based on your financial decisions:
            
            • You made ${wiseChoices} wise choices out of ${tilesClicked} total decisions
            • Your average spending per decision was ₹${Math.round((3000 - budget) / tilesClicked)}
            • You saved approximately ₹${moneySaved} by choosing cost-effective options
            • ${budget > 1500 ? "Great job maintaining over half your budget!" : "Be careful, you're spending quickly!"}
            
            Recommendation: Continue comparing prices and considering alternatives before making purchases.
            `;
            resolve(simulatedResponse);
          }, 2000);
        });
      }
      
      function formatAPIResponse(text) {
        // Parse the response into insights
        const lines = text.split('\n').filter(line => line.trim() && line.includes('•'));
        return lines.map(line => ({
          text: line.replace('•', '').trim(),
          type: line.includes('Great job') || line.includes('wise choices') ? 'good' : 
                line.includes('Be careful') ? 'warning' : 'neutral'
        }));
      }
      
      function generateLocalAnalysis(summary) {
        // Calculate metrics
        const avgSpend = (summary.totalSpent / summary.choices.length).toFixed(0);
        const savingsRate = (summary.remainingBudget / 3000) * 100;
        
        return {
          insights: [
            {
              text: savingsRate > 50 ?
                `Excellent savings! (${savingsRate.toFixed(0)}% of budget remaining)` :
                `Only ${savingsRate.toFixed(0)}% left - spend more carefully`,
              type: savingsRate > 50 ? "good" : "warning"
            },
            {
              text: `Average spend: ₹${avgSpend} per decision ${avgSpend > 200 ? "→ Too high!" : "→ Good control!"}`,
              type: avgSpend > 200 ? "warning" : "good"
            },
            {
              text: wiseChoices > tilesClicked / 2 ?
                `Great! ${wiseChoices} out of ${tilesClicked} choices were cost-effective` :
                `Only ${wiseChoices} out of ${tilesClicked} choices were cost-effective`,
              type: wiseChoices > tilesClicked / 2 ? "good" : "bad"
            },
            {
              text: `You saved approximately ₹${moneySaved} by choosing wisely`,
              type: "good"
            }
          ]
        };
      }
      
      function displayFeedback(data) {
        // Clear previous content
        aiInsights.innerHTML = '';
        
        // Add all insights
        data.insights.forEach(insight => {
          const insightDiv = document.createElement('div');
          insightDiv.className = `insight ${insight.type}`;
          insightDiv.innerHTML = `
            <span class="insight-icon">${data.source === "AI Financial Advisor" ? "🤖" : "📊"}</span>
            <div class="insight-content">${insight.text}</div>
          `;
          aiInsights.appendChild(insightDiv);
        });
        
        // Set lesson content
        lessonTitle.textContent = "Financial Wisdom";
        lessonContent.textContent = "Making smart spending decisions is key to financial health. Always compare options and consider alternatives before purchasing.";
        
        // Set summary
        aiSummary.textContent = `${data.source} analysis complete. Remember: Small savings add up to big financial wins over time!`;
        
        // Hide loader and show content
        hideLoading();
        
        // Show the feedback panel
        aiFeedbackPanel.classList.remove('hidden');
      }
      
      function showLoading() {
        aiFeedbackPanel.classList.remove('hidden');
        loadingSpinner.classList.remove('hidden');
        aiFeedbackContent.style.display = 'none';
      }
      
      function hideLoading() {
        loadingSpinner.classList.add('hidden');
        aiFeedbackContent.style.display = 'block';
      }
      
      // Initialize game
      function initGame() {
        // Create background particles
        createParticles();
        
        // Create the board
        createBoard();
        
        // Add event listener for the draw button
        drawButton.addEventListener('click', drawBall);
        
        // Close button for modal
        document.querySelector('.close-button').addEventListener('click', closeModal);
        document.querySelector('.close-modal-btn').addEventListener('click', closeModal);
        
        // Restart game button
        restartGame.addEventListener('click', function() {
          window.location.reload();
        });
        
        // Initialize displays
        updateBudgetDisplay();
        updateStatsDisplay();
        
        console.log("Game initialized");
      }
      
      // Start the game
      initGame();
    });
